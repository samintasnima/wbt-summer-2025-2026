<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form1</title>

</head>

<body>
    <form class="card">
        <div class="card-header">
            <h2>GET STARTED</h2>
            <h1>Create your workspace</h1>
        </div>

        <div class="field">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Jane Doe">
        </div>

        <div class="field">

            <label for="phone number">Phone Number</label>
            <input type="number" id="Phone Number" placeholder="5551234567">
        </div>

        <div class="field">

            <label for="dob">Date of Birth</label>
            <input type="date" placeholder="25/06/2026">
        </div>

        <div class="field">

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="jane@company.com">

        </div>

        <div class="field">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 8 characters">
        </div>
        <div class="field">
        <label><input type="checkbox" name="option" value="email me product updates and tips"> Email me product updates and tips</label>
        <br>
        <label><input type="checkbox" name="option" value="i agree to the terms & privacy policy"> I agree to the Terms & Privacy Policy</label> 
        </div><br>
        <div class="button">
            <input type="submit" value="Create workspace">
            <input type="reset" value="Reset">
        </div>
    </form>
</body>

</html>
